<script>
const STORE_KEY = 'stockLedgerData_v1';

function loadData(){
  const raw = localStorage.getItem(STORE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){}
  }
  return { items: [], purchases: [], sales: [] };
}
let data = loadData();

// migrate legacy single-item sale records (pre multi-item cart) into the items[] format
function migrateSalesData(){
  let changed = false;
  data.sales = (data.sales||[]).map(s=>{
    if(s.items) return s;
    changed = true;
    return {
      id: s.id, date: s.date, customerName: s.customerName||'', paymentType: s.paymentType,
      revenue: s.revenue, cogs: s.cogs, profit: s.profit, margin: s.margin,
      amountPaid: s.amountPaid, balance: s.balance, payments: s.payments||[],

  if(name==='credit') renderCredit();
  if(name==='items') renderItems();
}
